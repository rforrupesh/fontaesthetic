baseURL = "https://rforrupesh.github.io/fontaesthetic/"
title = "FancyText"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false
enableRobotsTXT = true
uglyURLs = false
canonifyURLs = false
layoutDir = "_layouts"

[params]
  logoLetter = "F"

[languages]
  [languages.en]
    languageName = "English"
    languageCode = "en-us"
    weight = 1
    contentDir = "content/en"
    [languages.en.params]
      placeholder = "Type your text here"
      tagline = "Type your text once — every style below updates in place."
  [languages.fr]
    languageName = "Français"
    languageCode = "fr-fr"
    weight = 2
    contentDir = "content/fr"
    [languages.fr.params]
      placeholder = "Tapez votre texte ici"
      tagline = "Tapez votre texte une fois — chaque style ci-dessous se met à jour."

[outputs]
  home = ["HTML", "RSS"]
