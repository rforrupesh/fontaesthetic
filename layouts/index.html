{{ define "main" }}
<header>
  <h1>{{ i18n "home_title" }}</h1>
  <p>{{ .Site.Params.tagline }}</p>
</header>

<div class="input-row">
  <span class="input-icon" aria-hidden="true">✎</span>
  <input id="srcInput"
         type="text"
         maxlength="60"
         placeholder="{{ .Site.Params.placeholder }}"
         data-placeholder-text="{{ .Site.Params.placeholder }}"
         data-copy-label="{{ i18n "copy_btn" }}"
         data-copied-label="{{ i18n "copied_btn" }}"
         autocomplete="off" spellcheck="false" autofocus>
</div>

<div id="grid"></div>

<div class="seo-content">
{{ .Content }}
</div>

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebApplication",
  "name": {{ .Site.Title | jsonify }},
  "url": {{ .Permalink | jsonify }},
  "applicationCategory": "UtilitiesApplication",
  "operatingSystem": "Any",
  "offers": {
    "@type": "Offer",
    "price": "0",
    "priceCurrency": "USD"
  },
  "inLanguage": {{ .Language.Lang | jsonify }}
}
</script>
{{ end }}
