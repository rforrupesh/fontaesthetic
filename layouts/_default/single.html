{{ define "main" }}
<article class="blog-post">
  <h1>{{ .Title }}</h1>
  {{ .Content }}
</article>

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BlogPosting",
  "headline": {{ .Title | jsonify }},
  "description": {{ .Description | jsonify }},
  "datePublished": {{ .Date.Format "2006-01-02T15:04:05Z07:00" | jsonify }},
  "dateModified": {{ .Lastmod.Format "2006-01-02T15:04:05Z07:00" | jsonify }},
  "inLanguage": {{ .Language.Lang | jsonify }},
  "mainEntityOfPage": { "@type": "WebPage", "@id": {{ .Permalink | jsonify }} },
  "author": { "@type": "Organization", "name": {{ .Params.author | default .Site.Title | jsonify }} },
  "publisher": { "@type": "Organization", "name": {{ .Site.Title | jsonify }} }
  {{ with .Params.image }},"image": {{ . | absURL | jsonify }}{{ end }}
}
</script>

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    {"@type": "ListItem", "position": 1, "name": {{ i18n "breadcrumb_home" | jsonify }}, "item": {{ .Site.Home.Permalink | jsonify }} },
    {"@type": "ListItem", "position": 2, "name": {{ (.Site.GetPage "section" "blog").Title | jsonify }}, "item": {{ (.Site.GetPage "section" "blog").Permalink | jsonify }} },
    {"@type": "ListItem", "position": 3, "name": {{ .Title | jsonify }}, "item": {{ .Permalink | jsonify }} }
  ]
}
</script>

{{ if .Params.faq }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "mainEntity": [
    {{ range $i, $item := .Params.faq }}{{ if $i }},{{ end }}
    { "@type": "Question", "name": {{ $item.q | jsonify }}, "acceptedAnswer": { "@type": "Answer", "text": {{ $item.a | jsonify }} } }
    {{ end }}
  ]
}
</script>
{{ end }}
{{ end }}
