{{ define "main" }}
<header><h1>{{ .Title }}</h1></header>
<div class="page-intro">{{ .Content }}</div>
<div class="use-grid">
  {{ range (slice "★" "☆" "♥" "♦" "♣" "♠" "☯" "☠" "☮" "✓" "✗" "→") }}
  <button type="button" class="use-item symbol-copy" data-symbol="{{ . }}">
    <span class="use-icon">{{ . }}</span>
  </button>
  {{ end }}
</div>
{{ end }}
